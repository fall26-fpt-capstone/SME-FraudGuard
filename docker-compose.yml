services:
  postgres:
    image: postgres:16-alpine
    container_name: fraudguard-postgres
    environment:
      POSTGRES_DB: fraudguard
      POSTGRES_USER: fraudguard
      POSTGRES_PASSWORD: fraudguard
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - fraudguard-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraudguard -d fraudguard"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  fraudguard-pgdata:
