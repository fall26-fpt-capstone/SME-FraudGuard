spring:
  application:
    name: fraudguard-service
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway, Hibernate only verifies it
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    com.fraudguard: INFO

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

auth:
  jwt:
    secret: ${AUTH_JWT_SECRET}
    ttl: PT15M
