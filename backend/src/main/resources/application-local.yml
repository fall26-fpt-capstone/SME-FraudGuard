spring:
  config:
    import:
      - "optional:file:./.env[.properties]"
      - "optional:file:./backend/.env[.properties]"
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fraudguard}
    username: ${DB_USER:fraudguard}
    password: ${DB_PASSWORD:fraudguard}

logging:
  level:
    com.fraudguard: DEBUG

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
